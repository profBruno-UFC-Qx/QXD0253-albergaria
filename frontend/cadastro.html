<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Albergaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-site">
    <main class="d-flex justify-content-center align-items-center vh-100">
        <div class="card card-cadastro shadow-sm p-3 rounded-4">
            <form class="formulario" id="form-cad">
                <div class="d-flex justify-content-center mb-3">
                    <label class="form-label text-muted small">O que você é?</label>
                </div>
                <div class="d-flex justify-content-around gap-4 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="rdAnunciante">
                        <label class="form-check-label" for="rdAnunciante">Anunciante</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="rdInteressado">
                        <label class="form-check-label" for="rdInteressado">Interessado</label>
                    </div>
                </div>
                <div class="mb-3">
                     <div class="input-group">
                        <input type="text" id="txtNome" class="form-control" placeholder="Nome">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <input type="text" id="txtSobrenome" class="form-control" placeholder="Sobrenome">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <input type="text" id="txtUsuario" class="form-control" placeholder="Usuario">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <input type="email" id="txtEmail" class="form-control" placeholder="E-mail">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <input type="tel" id="txtTelefone" class="form-control" placeholder="Telefone">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <input type="password" id="txtSenha" class="form-control" placeholder="Digite uma senha">
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <input type="password" id="txtSenhaConfirmacao" class="form-control" placeholder="Confirme a senha">
                    </div>
                </div>
                <div class="text-center">
                    <button class="btn btn-primario w-50 text-white mb-3">Criar</button>
                </div>
            </form>
        </div>
    </main>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
