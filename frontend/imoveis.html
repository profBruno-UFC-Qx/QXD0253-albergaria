<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Imóveis | Albergaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="bg-site">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-12 col-md-3 col-lg-2 bg-claro border-end p-3 d-flex flex-md-column">
                <a class="navbar-brand fw-bold fs-4 mb-md-4 me-3 me-md-0" href="./index.html">Albergaria</a>
                <nav class="nav nav-pills flex-md-column flex-grow-1">
                    <a class="nav-link text-dark" href="./painel.html">Visão Geral</a>
                    <a class="nav-link active bg-success" href="./imoveis.html">Meus Imóveis</a>
                    <a class="nav-link text-dark" href="./contatos.html">Contatos Recebidos</a>
                    <a class="nav-link text-dark" href="./perfil.html">Meu Perfil</a>
                    <button type="button" id="btn-logout-painel" class="btn btn-outline-danger mt-md-auto">Sair</button>
                </nav>
            </aside>
            <main class="col-12 col-md-9 col-lg-10 p-3 p-md-4">
                <header class="mb-4">
                    <h3 class="fw-bold mb-0">Meus Imóveis</h3>
                    <p class="text-secondary">Gerencie seus anúncios publicados, edite informações ou altere a
                        disponibilidade.</p>
                </header>
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-3">
                        <form id="formFiltros">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-4">
                                    <label for="filtroBusca" class="visually-hidden">Buscar imóveis</label>
                                    <div class="position-relative">
                                        <input type="text" id="filtroBusca" name="busca"
                                            class="form-control form-control-sm"
                                            placeholder="Buscar por nome ou bairro...">
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <label for="filtroStatus" class="form-label small fw-semibold mb-1">Status</label>
                                    <select id="filtroStatus" name="status" class="form-select form-select-sm">
                                        <option value="todos">Todos</option>
                                        <option value="ativo">Ativo</option>
                                        <option value="indisponivel">Indisponível</option>
                                        <option value="alugado">Alugado</option>
                                        <option value="pausado">Pausado</option>
                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <label for="ordenacao" class="form-label small fw-semibold mb-1">Ordenar por</label>
                                    <select id="ordenacao" name="ordem" class="form-select form-select-sm">
                                        <option value="recentes">Mais recentes</option>
                                        <option value="maior-preco">Maior preço</option>
                                        <option value="menor-preco">Menor preço</option>
                                    </select>
                                </div>
                                <div class="col-md-2 d-flex gap-2">
                                    <button type="submit" id="btnFiltrar" class="btn btn-sm btn-success flex-grow-1">
                                        Filtrar </button>
                                </div>

                            </div>
                        </form>
                    </div>
                </div>
                <div class="d-flex justify-content-end m-2">
                    <a class="btn btn-success" href="./cadastro-imovel.html">
                        <i class="fa-solid fa-plus me-1" aria-hidden="true"></i>Cadastrar imóvel
                    </a>
                </div>
                <div class="table-responsive bg-white rounded">
                    <table class="table table-hover vh-100">
                        <thead>
                            <tr></tr>
                        </thead>
                        <tbody id="tbody-imoveis">
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
