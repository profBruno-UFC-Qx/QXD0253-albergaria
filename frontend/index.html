<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Albergaria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="bg-site">
  <header class="border-bottom bg-claro">
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand fw-bold" href="./index.html">
          Albergaria
        </a>
        <a class="text-decoration-none text-dark">Início</a>
        <a class="text-decoration-none text-dark">Buscar Imóveis</a>
        <div class="d-flex justify-content-center" id="navbarNav">
          <a href="#" class="btn">Entrar</a>
        </div>
      </div>
    </nav>
  </header>
  <section class="position-relative w-100">
    <div class="banner-img d-flex justify-content-center align-items-center position-relative">
      <img src="./images/imagem4.jpg" id="img-destaque" class="position-absolute">
      <form class="pesquisa d-flex gap-2 w-50 position-relative z-2">
        <input type="text" id="txtPesquisa" class="form-pesquisa" placeholder="Pesquisar...">
        <button type="submit" class="btn btn-primario text-white">Pesquisar</button>
      </form>
    </div>
  </section>
  <main>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold py-3">Imóveis em destaque</h2>
    </div>
    <div class="row">
      <div class="card-aptos col-md-4">
        <div class="card h-100 shadow-sm border-0">
          <div class="position-relative">
            <img src="./images/image1.jpeg" class="img-aptos card-img-top">
          </div>
          <div class="card-body">
            <h5 class="card-title fw-bold fs-6">Apartamento no Centro</h5>
            <p class="text-success fw-bold fs-5 mb-3">R$ 1.250/mês</p>
          </div>
        </div>
      </div>
      <div class="card-aptos col-md-4">
        <div class="card h-100 shadow-sm border-0">
          <div class="position-relative">
            <img src="./images/image2.jpeg" class="img-aptos card-img-top">
          </div>
          <div class="card-body">
            <h5 class="card-title fw-bold fs-6">Casa no Aeroporto</h5>
            <p class="text-success fw-bold fs-5 mb-3">R$ 1.800/mês</p>
          </div>
        </div>
      </div>
      <div class="card-aptos col-md-4">
        <div class="card h-100 shadow-sm border-0">
          <div class="position-relative">
            <img src="./images/image3.jpeg" class="img-aptos card-img-top">
          </div>
          <div class="card-body">
            <h5 class="card-title fw-bold fs-6">Kitnet no Planalto</h5>
            <p class="text-success fw-bold fs-5 mb-3">R$ 700/mês</p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./js/main.js"></script>
</body>

</html>
