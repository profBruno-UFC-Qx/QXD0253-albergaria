<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes do imóvel | Albergaria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="bg-site">
<header class="border-bottom bg-claro">
  <nav class="navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="./index.html">Albergaria</a>
      <div class="d-flex align-items-center gap-2" id="nav-auth"></div>
    </div>
  </nav>
</header>
<main class="container py-3">
  <section class="row g-2 mt-2 mb-4">
    <div class="col-12 col-md-9 d-flex justify-content-center">
      <img src="./images/image2.jpeg" class="img-rosto">
    </div>

    <div class="col-12 col-md-3">
      <div class="row row-cols-3 row-cols-md-1 g-2">
        <div class="col">
          <img src="./images/image1.jpeg" class="img-exibicao">
        </div>
        <div class="col">
          <img src="./images/image3.jpeg" class="img-exibicao">
        </div>
      </div>
    </div>
  </section>
  <section class="row g-4">

    <article class="col-12 col-md-8">
      <h4 class="fw-bold">Apartamento aconchegante no Centro</h4>
      <p class="text-secondary mb-2">Centro, Quixadá - CE</p>
      <p class="h3 text-success fw-bold mb-3">R$ 1.250/mês</p>
      <ul class="list-inline text-secondary border-bottom pb-3">
        <li class="list-inline-item me-3">2 quartos</li>
        <li class="list-inline-item me-3">1 banheiro</li>
        <li class="list-inline-item">68 m²</li>
      </ul>
      <p>
        Apartamento bem localizado, próximo a comércios, faculdades e
        transporte público. Ideal para quem busca conforto e praticidade.
      </p>

      <div class="d-flex gap-2 mt-4">
        <button
                type="button"
                id="btn-favoritar"
                class="btn btn-outline-success flex-fill"
                data-btn-favorito
                data-imovel-id=""
        >
          ☆ Favoritar
        </button>
        <button
                type="button"
                id="btn-tenho-interesse"
                class="btn btn-success flex-fill"
        >
          Tenho interesse
        </button>
      </div>
      <div id="feedback-favorito" class="mt-2" aria-live="polite"></div>
    </article>

    <aside class="col-12 col-md-4">
      <div id="map-detalhes" class="rounded"></div>
    </aside>

  </section>
</main>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="./js/main.js"></script>
</body>

</html>
