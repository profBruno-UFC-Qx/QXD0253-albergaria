<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Anuncio | Albergaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="bg-site">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-12 col-md-3 bg-claro border-end p-3 d-flex flex-md-column">
                <a class="navbar-brand fw-bold fs-4 mb-md-4 me-3 me-md-0" href="./index.html">Albergaria</a>
                <nav class="nav nav-pills flex-md-column flex-grow-1">
                    <a class="nav-link text-dark" href="./painel.html">Visão Geral</a>
                    <a class="nav-link text-dark" href="./imoveis.html">Meus Imóveis</a>
                    <a class="nav-link text-dark" href="./contatos.html">Contatos Recebidos</a>
                    <a class="nav-link text-dark" href="./perfil.html">Meu Perfil</a>
                    <button type="button" id="btn-logout-painel" class="btn btn-outline-danger mt-md-auto">Sair</button>
                </nav>
            </aside>
            <main class="col-12 col-md-9 p-4">
                <header class="mb-4">
                    <h3 class="fw-bold mb-0">Cadastrar Anúncio</h3>
                    <p class="text-secondary">Preencha as informações do anúncio.</p>
                </header>
                <form id="form-cad-anuncio" class="card">
                    <div class="card-body">
                        <div class="row g-4 align-items-start">
                            <div class="col-12 col-md-6">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label for="txtTitulo" class="form-label">Título do anúncio</label>
                                        <input type="text" class="form-control" id="txtTitulo"
                                            placeholder="Ex: Apartamento no Centro">
                                    </div>
                                    <div class="col-12">
                                        <label for="txaDescricao" class="form-label">Descrição do Anúncio</label>
                                        <textarea class="form-control" id="txaDescricao" rows="4"
                                            placeholder="Digite aqui sobre o imóvel"></textarea>
                                    </div>
                                    <div class="col-12">
                                        <label for="nbrPreco" class="form-label">Preço mensal</label>
                                        <div class="input-group">
                                            <span class="input-group-text">R$</span>
                                            <input type="number" class="form-control" id="nbrPreco" placeholder="0,00"
                                                step="0.01">
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-success btn-lg" id="btnSubmit">Publicar Anúncio</button>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-md-6 d-flex flex-column justify-content-start">
                                <label class="form-label fw-semibold">Selecione o imóvel</label>
                                <div class="table-responsive border rounded bg-white"
                                    style="max-height: 360px; overflow-y: auto;">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead>
                                        </thead>
                                        <tbody id="tbody-selecao-imoveis">
                                            <tr>
                                                <td colspan="3" class="text-center text-muted py-3">Carregando imóveis...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
