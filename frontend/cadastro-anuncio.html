<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Anuncio | Albergaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="bg-site">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-12 col-md-3 col-lg-2 bg-claro border-end p-3 d-flex flex-md-column">
                <a class="navbar-brand fw-bold fs-4 mb-md-4 me-3 me-md-0" href="./index.html">Albergaria</a>
                <nav class="nav nav-pills flex-md-column flex-grow-1">
                    <a class="nav-link text-dark" href="./painel.html">Visão geral</a>
                    <a class="nav-link text-dark" href="./imoveis.html">Meus imóveis</a>
                </nav>
            </aside>
            <main class="col-12 col-md-9 col-lg-10 p-3 p-md-4">
                <header class="mb-4">
                    <h3 class="fw-bold mb-0">Cadastrar Anúncio</h3>
                    <p class="text-secondary">Preencha as informações do anúncio.</p>
                </header>
                <form id="form-imovel" class="card">
                    <div class="card-body">
                        <div class="row g-4">
                            <div class="col-12 col-md-8">
                                <div class="row g-3">
                                    <div class="col-12 col-md-8">
                                        <label for="txtTitulo" class="form-label">Título do anúncio</label>
                                        <input type="text" class="form-control" id="txtTitulo" placeholder="Ex: Apartamento no Centro">
                                    </div>
                                    <div class="col-12 col-md-8">
                                        <label for="txaDescricao" class="form-label">Descrição do Anúncio</label>
                                        <textarea class="form-control" id="txaDescricao" rows="4" placeholder="Digite aqui sobre o imóvel"></textarea>
                                    </div>
                                    <div class="col-12 col-md-8">
                                        <label for="nbrPreco" class="form-label">Preço mensal</label>
                                        <div class="input-group">
                                            <span class="input-group-text">R$</span>
                                            <input type="number" class="form-control" id="nbrPreco" placeholder="0,00">
                                        </div>
                                    </div>
                                    <div class="">
                                        <button type="submit" class="btn btn-success btn-lg">Publicar Anúncio</button>
                                    </div>
                                </div>
                                
                            </div>
                            <div class="col-12 col-md-4 d-flex flex-column mt-3">
                                    <img src="./images/image1.jpeg" class="img-aptos">
                            </div> 
                        </div>
                    </div>
                </form>
            </main>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
